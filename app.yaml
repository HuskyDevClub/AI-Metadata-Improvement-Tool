# Databricks Apps Configuration
# Secret-backed env vars are wired via app-level resources (set in CI by
# `databricks apps update --json`), referenced here by `valueFrom: <resource-name>`.

command:
  - "sh"
  - "-c"
  - |
    pip install -r backend/requirements.txt && \
    uvicorn backend.main:app --host 0.0.0.0 --port "${PORT:-8000}"

env:
  - name: SOCRATA_APP_TOKEN
    valueFrom: socrata-app-token
  - name: SOCRATA_SECRET_TOKEN
    valueFrom: socrata-secret-token
  # Sole control for the "Sign in with data.wa.gov" UI (not a secret, so set
  # directly). Set to "false" to hide the button. SOCRATA_SECRET_TOKEN above is
  # still required for OAuth to complete once the button is shown.
  - name: ENABLE_SOCRATA_OAUTH
    value: "true"
  # Stable session/OAuth crypto so user sessions survive app restarts and
  # redeploys, and OAuth state validation works across workers. Without these
  # the backend mints a fresh key per process (logging everyone out on restart).
  # CI generates each one once if absent and reuses it thereafter (see
  # .github/workflows/deploy-databricks.yml).
  - name: SESSION_ENCRYPTION_KEY
    valueFrom: session-encryption-key
  - name: OAUTH_STATE_SECRET
    valueFrom: oauth-state-secret
  - name: LLM_ENDPOINT
    valueFrom: llm-endpoint
  - name: LLM_API_KEY
    valueFrom: llm-api-key
  - name: LLM_MODEL
    valueFrom: llm-model
  - name: FRONTEND_URL
    valueFrom: frontend-url
